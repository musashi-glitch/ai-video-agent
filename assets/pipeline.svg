<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Pipeline: stills (Nano Banana), motion (Kling v3 Pro), lip-sync (MiniMax), timeline (Kino), export (X/Twitter), with job recovery and spend logging across every step">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#15102a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="0.25" stop-color="#a46bff"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="0.75" stop-color="#2fd3c9"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ffffff" fill-opacity="0.5"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.1; }
      .num { font-size: 16px; letter-spacing: 2px; }
      .stage { font-size: 32px; font-weight: 700; fill: #ffffff; }
      .model { font-size: 20px; fill: #c9c4e8; }
      .skill { font-size: 16px; fill: #ffffff; fill-opacity: 0.55; }
      @keyframes flow { to { stroke-dashoffset: -24 } }
      .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    </style>
  </defs>

  <rect width="1280" height="330" rx="20" fill="url(#bg)"/>

  <!-- connectors -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path class="flow" d="M258 130H284"/>
    <path class="flow" d="M504 130H530"/>
    <path class="flow" d="M750 130H776"/>
    <path class="flow" d="M996 130H1022"/>
  </g>

  <!-- 01 -->
  <rect class="card" x="40" y="40" width="216" height="180" rx="14"/>
  <rect x="40" y="40" width="216" height="4" rx="2" fill="#ff4fd8"/>
  <text x="64" y="80" class="mono num" fill="#ff4fd8">01</text>
  <text x="64" y="124" class="sans stage">Stills</text>
  <text x="64" y="156" class="sans model">Nano Banana</text>
  <text x="64" y="196" class="mono skill">stills</text>

  <!-- 02 -->
  <rect class="card" x="286" y="40" width="216" height="180" rx="14"/>
  <rect x="286" y="40" width="216" height="4" rx="2" fill="#a46bff"/>
  <text x="310" y="80" class="mono num" fill="#a46bff">02</text>
  <text x="310" y="124" class="sans stage">Motion</text>
  <text x="310" y="156" class="sans model">Kling v3 Pro</text>
  <text x="310" y="196" class="mono skill">motion-kling</text>

  <!-- 03 -->
  <rect class="card" x="532" y="40" width="216" height="180" rx="14"/>
  <rect x="532" y="40" width="216" height="4" rx="2" fill="#5b8cff"/>
  <text x="556" y="80" class="mono num" fill="#5b8cff">03</text>
  <text x="556" y="124" class="sans stage">Lip-sync</text>
  <text x="556" y="156" class="sans model">MiniMax</text>
  <text x="556" y="196" class="mono skill">lipsync</text>

  <!-- 04 -->
  <rect class="card" x="778" y="40" width="216" height="180" rx="14"/>
  <rect x="778" y="40" width="216" height="4" rx="2" fill="#2fd3c9"/>
  <text x="802" y="80" class="mono num" fill="#2fd3c9">04</text>
  <text x="802" y="124" class="sans stage">Timeline</text>
  <text x="802" y="156" class="sans model">Kino · bar grid</text>
  <text x="802" y="196" class="mono skill">timeline-placement</text>

  <!-- 05 -->
  <rect class="card" x="1024" y="40" width="216" height="180" rx="14"/>
  <rect x="1024" y="40" width="216" height="4" rx="2" fill="#ffd166"/>
  <text x="1048" y="80" class="mono num" fill="#ffd166">05</text>
  <text x="1048" y="124" class="sans stage">Export</text>
  <text x="1048" y="156" class="sans model">1080p for X</text>
  <text x="1048" y="196" class="mono skill">export-to-twitter</text>

  <!-- safety rail -->
  <rect x="40" y="244" width="1200" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="url(#rail)" stroke-opacity="0.6"/>
  <text x="64" y="276" class="mono" font-size="17" fill="#ffffff" fill-opacity="0.85">
    <tspan fill="#ff8fe6">every step</tspan>  fal-job-recovery · spend-log   —   no lost jobs, no double-pays, every dollar logged
  </text>
</svg>
