<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ai-video-agent: stills, motion, lip-sync, timeline, export">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#17112e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#2fd3c9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fd3c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e7d9ff"/>
      <stop offset="1" stop-color="#ff8fe6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="1" stop-color="#ff7ab8"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22306e"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="f1"><rect x="80" y="282" width="210" height="88" rx="6"/></clipPath>
    <clipPath id="f2"><rect x="307" y="282" width="210" height="88" rx="6"/></clipPath>
    <clipPath id="f3"><rect x="535" y="282" width="210" height="88" rx="6"/></clipPath>
    <clipPath id="f4"><rect x="762" y="282" width="210" height="88" rx="6"/></clipPath>
    <clipPath id="f5"><rect x="990" y="282" width="210" height="88" rx="6"/></clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { font-size: 11px; fill: #ffffff; fill-opacity: 0.85; letter-spacing: 1.5px; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0.15 } }
      .rec { animation: blink 1.4s steps(1) infinite; }
      @keyframes wave { 0%, 100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
      .bar { transform-box: fill-box; transform-origin: center; animation: wave 0.9s ease-in-out infinite; }
      @keyframes play { from { transform: translateX(0) } to { transform: translateX(186px) } }
      .head { animation: play 4s linear infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-24px) } }
      .drift { animation: drift 2.5s ease-in-out infinite alternate; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glowB)"/>

  <!-- viewfinder corners -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M40 64V40H64"/><path d="M1216 40H1240V64"/>
  </g>
  <g class="mono" font-size="13" fill="#ffffff" fill-opacity="0.7">
    <circle class="rec" cx="1060" cy="62" r="6" fill="#ff3b5c" fill-opacity="1"/>
    <text x="1074" y="67">REC</text>
    <text x="1112" y="67">00:00:12:08</text>
  </g>

  <!-- title -->
  <text x="80" y="150" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#title)">ai-video-agent</text>
  <text x="82" y="196" class="sans" font-size="24" fill="#c9c4e8">Agent skills &amp; playbooks for AI video production.</text>
  <text x="82" y="232" class="mono" font-size="15" fill="#ff8fe6" letter-spacing="1">stills → image-to-video → lip-sync → timeline → export</text>

  <!-- film strip -->
  <rect x="60" y="262" width="1160" height="128" rx="10" fill="#07060d" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#ffffff" fill-opacity="0.14">
    <rect x="78" y="268" width="12" height="8" rx="2"/><rect x="118" y="268" width="12" height="8" rx="2"/><rect x="158" y="268" width="12" height="8" rx="2"/><rect x="198" y="268" width="12" height="8" rx="2"/><rect x="238" y="268" width="12" height="8" rx="2"/><rect x="278" y="268" width="12" height="8" rx="2"/><rect x="318" y="268" width="12" height="8" rx="2"/><rect x="358" y="268" width="12" height="8" rx="2"/><rect x="398" y="268" width="12" height="8" rx="2"/><rect x="438" y="268" width="12" height="8" rx="2"/><rect x="478" y="268" width="12" height="8" rx="2"/><rect x="518" y="268" width="12" height="8" rx="2"/><rect x="558" y="268" width="12" height="8" rx="2"/><rect x="598" y="268" width="12" height="8" rx="2"/><rect x="638" y="268" width="12" height="8" rx="2"/><rect x="678" y="268" width="12" height="8" rx="2"/><rect x="718" y="268" width="12" height="8" rx="2"/><rect x="758" y="268" width="12" height="8" rx="2"/><rect x="798" y="268" width="12" height="8" rx="2"/><rect x="838" y="268" width="12" height="8" rx="2"/><rect x="878" y="268" width="12" height="8" rx="2"/><rect x="918" y="268" width="12" height="8" rx="2"/><rect x="958" y="268" width="12" height="8" rx="2"/><rect x="998" y="268" width="12" height="8" rx="2"/><rect x="1038" y="268" width="12" height="8" rx="2"/><rect x="1078" y="268" width="12" height="8" rx="2"/><rect x="1118" y="268" width="12" height="8" rx="2"/><rect x="1158" y="268" width="12" height="8" rx="2"/><rect x="1198" y="268" width="12" height="8" rx="2"/>
    <rect x="78" y="376" width="12" height="8" rx="2"/><rect x="118" y="376" width="12" height="8" rx="2"/><rect x="158" y="376" width="12" height="8" rx="2"/><rect x="198" y="376" width="12" height="8" rx="2"/><rect x="238" y="376" width="12" height="8" rx="2"/><rect x="278" y="376" width="12" height="8" rx="2"/><rect x="318" y="376" width="12" height="8" rx="2"/><rect x="358" y="376" width="12" height="8" rx="2"/><rect x="398" y="376" width="12" height="8" rx="2"/><rect x="438" y="376" width="12" height="8" rx="2"/><rect x="478" y="376" width="12" height="8" rx="2"/><rect x="518" y="376" width="12" height="8" rx="2"/><rect x="558" y="376" width="12" height="8" rx="2"/><rect x="598" y="376" width="12" height="8" rx="2"/><rect x="638" y="376" width="12" height="8" rx="2"/><rect x="678" y="376" width="12" height="8" rx="2"/><rect x="718" y="376" width="12" height="8" rx="2"/><rect x="758" y="376" width="12" height="8" rx="2"/><rect x="798" y="376" width="12" height="8" rx="2"/><rect x="838" y="376" width="12" height="8" rx="2"/><rect x="878" y="376" width="12" height="8" rx="2"/><rect x="918" y="376" width="12" height="8" rx="2"/><rect x="958" y="376" width="12" height="8" rx="2"/><rect x="998" y="376" width="12" height="8" rx="2"/><rect x="1038" y="376" width="12" height="8" rx="2"/><rect x="1078" y="376" width="12" height="8" rx="2"/><rect x="1118" y="376" width="12" height="8" rx="2"/><rect x="1158" y="376" width="12" height="8" rx="2"/><rect x="1198" y="376" width="12" height="8" rx="2"/>
  </g>

  <!-- 01 still -->
  <g clip-path="url(#f1)">
    <rect x="80" y="282" width="210" height="88" fill="url(#sky)"/>
    <circle cx="232" cy="318" r="16" fill="#ffd166"/>
    <path d="M80 370L130 318L162 346L196 306L250 370Z" fill="#1b1440"/>
    <path d="M150 370L214 330L290 370Z" fill="#2a1d5c"/>
  </g>
  <text x="90" y="300" class="mono lbl">01 STILL</text>

  <!-- 02 motion -->
  <g clip-path="url(#f2)">
    <rect x="307" y="282" width="210" height="88" fill="url(#sky)"/>
    <g class="drift">
      <circle cx="465" cy="318" r="16" fill="#ffd166"/>
      <path d="M307 370L367 316L399 346L433 304L497 370Z" fill="#1b1440"/>
      <path d="M387 370L451 328L541 370Z" fill="#2a1d5c"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <path d="M322 318H352"/><path d="M330 330H366"/><path d="M322 342H346"/>
    </g>
  </g>
  <text x="317" y="300" class="mono lbl">02 MOTION</text>

  <!-- 03 lip-sync -->
  <g clip-path="url(#f3)">
    <rect x="535" y="282" width="210" height="88" fill="#1a1238"/>
    <ellipse cx="590" cy="336" rx="22" ry="12" fill="#ff4fd8"/>
    <ellipse cx="590" cy="338" rx="14" ry="5" fill="#2a0b2a"/>
    <g fill="#2fd3c9">
      <rect class="bar" x="630" y="316" width="6" height="40" rx="3" style="animation-delay:0s"/>
      <rect class="bar" x="642" y="310" width="6" height="52" rx="3" style="animation-delay:.15s"/>
      <rect class="bar" x="654" y="322" width="6" height="28" rx="3" style="animation-delay:.3s"/>
      <rect class="bar" x="666" y="306" width="6" height="60" rx="3" style="animation-delay:.1s"/>
      <rect class="bar" x="678" y="318" width="6" height="36" rx="3" style="animation-delay:.25s"/>
      <rect class="bar" x="690" y="312" width="6" height="48" rx="3" style="animation-delay:.05s"/>
      <rect class="bar" x="702" y="324" width="6" height="24" rx="3" style="animation-delay:.35s"/>
      <rect class="bar" x="714" y="316" width="6" height="40" rx="3" style="animation-delay:.2s"/>
    </g>
  </g>
  <text x="545" y="300" class="mono lbl">03 LIP-SYNC</text>

  <!-- 04 timeline -->
  <g clip-path="url(#f4)">
    <rect x="762" y="282" width="210" height="88" fill="#111025"/>
    <g stroke="#ffffff" stroke-opacity="0.12">
      <path d="M786 310V364"/><path d="M816 310V364"/><path d="M846 310V364"/><path d="M876 310V364"/><path d="M906 310V364"/><path d="M936 310V364"/>
    </g>
    <rect x="772" y="314" width="58" height="14" rx="3" fill="#ff4fd8"/>
    <rect x="834" y="314" width="40" height="14" rx="3" fill="#a46bff"/>
    <rect x="878" y="314" width="76" height="14" rx="3" fill="#5b8cff"/>
    <rect x="772" y="332" width="90" height="14" rx="3" fill="#2fd3c9" fill-opacity="0.85"/>
    <rect x="866" y="332" width="88" height="14" rx="3" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="772" y="350" width="182" height="10" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <g class="head"><path d="M772 306V366" stroke="#ff3b5c" stroke-width="2"/><path d="M767 304H777L772 310Z" fill="#ff3b5c"/></g>
  </g>
  <text x="772" y="300" class="mono lbl">04 TIMELINE</text>

  <!-- 05 export -->
  <g clip-path="url(#f5)">
    <rect x="990" y="282" width="210" height="88" fill="#1a1238"/>
    <circle cx="1060" cy="336" r="22" fill="none" stroke="#ffd166" stroke-width="3"/>
    <path d="M1053 325L1071 336L1053 347Z" fill="#ffd166"/>
    <text x="1096" y="332" class="mono" font-size="13" fill="#ffffff" fill-opacity="0.9">1080p</text>
    <text x="1096" y="350" class="mono" font-size="11" fill="#ffffff" fill-opacity="0.55">H.264 · AAC</text>
  </g>
  <text x="1000" y="300" class="mono lbl">05 EXPORT</text>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.18">
    <rect x="80" y="282" width="210" height="88" rx="6"/><rect x="307" y="282" width="210" height="88" rx="6"/><rect x="535" y="282" width="210" height="88" rx="6"/><rect x="762" y="282" width="210" height="88" rx="6"/><rect x="990" y="282" width="210" height="88" rx="6"/>
  </g>
</svg>
